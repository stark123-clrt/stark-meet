services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NEXT_PUBLIC_MEDIASOUP_URL=${NEXT_PUBLIC_MEDIASOUP_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    depends_on:
      - mediasoup
    restart: unless-stopped
    networks:
      - stark-meet-network

  mediasoup:
    build:
      context: .
      dockerfile: Dockerfile.mediasoup
    ports:
      - "3001:3001"
      # ~2 ports UDP par participant connecté, toutes réunions confondues.
      # Doit rester identique à MEDIASOUP_MIN_PORT/MAX_PORT.
      - "40000-40399:40000-40399/udp"
      - "40000-40399:40000-40399/tcp"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CLIENT_URL=${NEXT_PUBLIC_APP_URL}
      - MEDIASOUP_ANNOUNCED_IP=${MEDIASOUP_ANNOUNCED_IP}
      - MEDIASOUP_MIN_PORT=40000
      - MEDIASOUP_MAX_PORT=40399
      # Un worker par cœur par défaut. À plafonner si le VPS partage son CPU.
      # - MEDIASOUP_WORKERS=2
    restart: unless-stopped
    networks:
      - stark-meet-network

networks:
  stark-meet-network:
    driver: bridge
